<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Calendar Club</title>
<meta name="description" content="Day X = X km. An advent calendar for runners, 1–24 December.">
<meta name="theme-color" content="#0a0a0b">
<!-- Remove the next line if you WANT search engines to list the page (it shows runners' names). -->
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%230a0a0b'/%3E%3Ccircle cx='20' cy='20' r='17' fill='none' stroke='%23f3f3f1'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='22' fill='%23f3f3f1' font-family='sans-serif'%3E%E2%89%A0%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* ===== DECK: four full-screen pages, one visible at a time, fading into each other ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#deck{position:fixed;inset:0;height:100vh;height:100dvh}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#2c2c30 transparent;
  opacity:0;visibility:hidden;transition:opacity .75s ease,visibility 0s linear .75s}
.page.active{opacity:1;visibility:visible;transition:opacity .75s ease .12s,visibility 0s}
.pin{min-height:100%;width:100%;max-width:var(--maxw);margin:0 auto;display:flex;flex-direction:column;justify-content:center;
  padding:calc(var(--bar) + 22px + env(safe-area-inset-top)) var(--pad) calc(var(--foot) + 22px + env(safe-area-inset-bottom));
  transform:translateY(18px);transition:transform .75s ease}
.page.active .pin{transform:none}

/* fixed chrome */
.bar,.foot{position:fixed;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);pointer-events:none}
.bar>*,.foot>*{pointer-events:auto}
.bar{top:0;height:calc(var(--bar) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);background:linear-gradient(var(--bg) 55%,rgba(10,10,11,0))}
.foot{bottom:0;height:calc(var(--foot) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);justify-content:center;background:linear-gradient(to top,var(--bg) 55%,rgba(10,10,11,0))}
.brand{display:flex;align-items:center;gap:12px}
.badge{width:28px;height:28px;flex:none}
.bar .right{display:flex;gap:18px;align-items:center}
.bar .num{color:var(--ink)}
.next{display:inline-flex;gap:12px;align-items:center;padding:10px 6px;color:var(--ink)}
.next .micro{color:var(--ink)}
.next .arr{display:inline-block;animation:nudge 1.9s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.next.up .arr{animation:none}
.dots{position:fixed;right:max(6px,calc(var(--pad) / 2 - 12px));top:50%;transform:translateY(-50%);z-index:21;display:flex;flex-direction:column}
.dots button{width:28px;height:28px;display:grid;place-items:center}
.dots button::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--ink-3);transition:all .3s}
.dots button:hover::before{background:var(--ink)}
.dots button[aria-current="true"]::before{width:7px;height:7px;background:var(--red);box-shadow:0 0 10px 2px rgba(255,43,43,.6)}

/* page 1 — hero */
.hero h1{font-size:clamp(46px,min(11.5vw,17vh,140px),158px);margin-top:20px}
.hero .lead{font-size:clamp(26px,min(5.2vw,8vh),68px);color:var(--ink-2);margin-top:.32em}
.hero .rule{margin-top:26px;max-width:520px}
.status{margin-top:30px;display:inline-flex;gap:12px;align-items:center;border:1px solid var(--line);padding:9px 16px;align-self:flex-start}
.demo-pill{display:inline-flex;gap:10px;align-items:center;margin-top:14px;color:var(--ink);align-self:flex-start}
#updated{margin-top:14px}

/* section headings */
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 32px;flex-wrap:wrap;margin-bottom:clamp(18px,3vh,36px)}
.sec-head h2{font-size:clamp(36px,min(7vw,11vh),92px)}
.sec-head .meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.notice{min-height:1.2em;margin-bottom:10px}

/* page 2 — calendar */
.cal{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
@media(min-width:720px){.cal{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media(min-width:1040px){.cal{grid-template-columns:repeat(12,minmax(0,1fr))}}
.tile{position:relative;background:var(--bg);text-align:left;padding:12px 10px 10px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:background .15s,color .15s}
@media(min-width:720px){.tile{min-height:clamp(104px,15vh,150px)}}
@media(min-width:1040px){.tile{min-height:clamp(120px,24vh,210px);padding:16px 14px 14px}}
.tile .n{font-size:clamp(22px,2.6vw,32px);font-weight:200;letter-spacing:-.01em;line-height:1}
.tile .km{letter-spacing:.14em;font-size:10px;white-space:nowrap}
.tile .bt{display:flex;flex-direction:column;gap:1px}
.tile .met{letter-spacing:.12em;font-size:10px;white-space:nowrap}
.tile:hover{background:var(--bg-2)}
.tile.future{color:var(--ink-3)}
.tile.today::after{content:"";position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 10px 2px rgba(255,43,43,.55)}
.tile[aria-pressed="true"]{background:var(--ink);color:#0a0a0b}
.tile[aria-pressed="true"] .micro{color:#555}

/* page 3 — leaderboard */
.board{border-top:1px solid var(--line)}
.head,.row{display:grid;grid-template-columns:54px minmax(0,1.5fr) repeat(6,minmax(0,1fr));column-gap:14px;align-items:baseline}
.board.all .head,.board.all .row{grid-template-columns:54px minmax(0,2.4fr) repeat(3,minmax(0,1fr));column-gap:18px}
.head{align-items:end;padding:14px 0;border-bottom:1px solid var(--line-2);position:sticky;top:calc(var(--bar) + env(safe-area-inset-top));background:rgba(10,10,11,.93);z-index:3}
.row{padding:17px 0;border-bottom:1px solid var(--line-2)}
.row .rank{font-size:13px;color:var(--ink-3);letter-spacing:.12em}
.row .name{display:block;font-size:clamp(17px,1.9vw,22px);font-weight:300;text-transform:uppercase;letter-spacing:.01em;overflow-wrap:anywhere}
.row .sub{display:block;margin-top:2px;letter-spacing:.2em;font-size:9.5px}
.row .v{font-size:clamp(15px,1.5vw,18px);font-variant-numeric:tabular-nums}
.row .u{margin-left:6px;font-size:9.5px;letter-spacing:.22em;color:var(--ink-3);font-weight:400}
.row.dim,.row.dim .name{color:var(--ink-3)}
.row.top{padding:clamp(22px,3.4vw,40px) 0 clamp(20px,3vw,34px);row-gap:18px;grid-template-areas:"rank who who who who who who who" ". . km sec pace tkm tsec tpace"}
.board.all .row.top{grid-template-areas:"rank who who who who" ". . tkm tsec tpace"}
.row.top .rank{grid-area:rank}.row.top .who{grid-area:who}.row.top .cell.km{grid-area:km}.row.top .cell.sec{grid-area:sec}.row.top .cell.pace{grid-area:pace}.row.top .cell.tkm{grid-area:tkm}.row.top .cell.tsec{grid-area:tsec}.row.top .cell.tpace{grid-area:tpace}
.row.top .rank{font-size:clamp(26px,4vw,50px);font-weight:200;color:var(--ink);letter-spacing:-.01em;line-height:1}
.row.top .name{font-size:clamp(30px,5.4vw,72px);font-weight:200;letter-spacing:-.015em;line-height:1}
.row.top .v{font-size:clamp(18px,1.8vw,25px);font-weight:200}
.board.all .row.top .v{font-size:clamp(20px,2.4vw,30px)}
.row .cell.tkm{padding-left:0}
.empty{padding:clamp(30px,6vh,80px) 0;border-bottom:1px solid var(--line-2)}
.empty .display{font-size:clamp(30px,5.4vw,72px);color:var(--ink-2)}
.ranknote{margin-top:14px}
@media(max-width:820px){
  .head{display:none}
  .row,.row.top,.board.all .row,.board.all .row.top{grid-template-columns:44px repeat(3,minmax(0,1fr));grid-template-areas:"rank who who who" ". km sec pace" ". tkm tsec tpace";column-gap:10px;row-gap:12px;align-items:start}
  .board.all .row,.board.all .row.top{grid-template-areas:"rank who who who" ". tkm tsec tpace"}
  .row .rank{grid-area:rank}.row .who{grid-area:who}.row .cell.km{grid-area:km}.row .cell.sec{grid-area:sec}.row .cell.pace{grid-area:pace}.row .cell.tkm{grid-area:tkm}.row .cell.tsec{grid-area:tsec}.row .cell.tpace{grid-area:tpace}
  .row .cell[data-s]::before{display:block;content:attr(data-s);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:400;margin-bottom:2px;white-space:nowrap}
  .row .cell.tkm,.row .cell.tsec,.row .cell.tpace{padding-top:12px;border-top:1px solid var(--line-2)}
  .board.all .row .cell.tkm,.board.all .row .cell.tsec,.board.all .row .cell.tpace{padding-top:0;border-top:0}
  .row .v{font-size:16px}
  .row.top .v,.board.all .row.top .v{font-size:19px}
  .row .u{margin-left:4px;letter-spacing:.14em}
}

/* page 4 — map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media(min-width:980px){.mapgrid{grid-template-columns:minmax(0,1fr) 330px}}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{padding:9px 14px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3);font-weight:400;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0a0a0b}
.mapwrap{position:relative;background:#050506;border:1px solid var(--line-2);overflow:hidden}
.mapwrap svg{display:block;width:100%;height:auto}
.land path{fill:#151517;stroke:#2d2d31;stroke-width:.8;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.glow{mix-blend-mode:screen;pointer-events:none}
.core{fill:#ff7a7a;pointer-events:none;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.dot.on .core{transform:scale(1.9)}
.hit{fill:transparent;cursor:pointer}
.maplabel{fill:#d6d6d2;font-family:var(--font);font-weight:400;letter-spacing:.16em;paint-order:stroke;stroke:#050506;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.tip{position:absolute;pointer-events:none;background:rgba(10,10,11,.94);border:1px solid var(--line);padding:10px 14px;white-space:nowrap;opacity:0;transform:translate(-50%,calc(-100% - 16px));transition:opacity .12s;z-index:5}
.tip.on{opacity:1}
.tip.below{transform:translate(-50%,18px)}
.tip b{display:block;font-weight:400;font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:2px}
.legend{display:flex;gap:10px;align-items:center;margin-top:12px}.legend i{flex:none}.legend span{min-width:0}
.legend i{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,rgba(255,43,43,.95),rgba(255,43,43,0) 70%)}
.cities{list-style:none}
.cities li{padding:13px 0;border-bottom:1px solid var(--line-2);cursor:default}
.cities li.on .cn{color:var(--red)}
.cities .line{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cities .cn{font-size:15px;text-transform:uppercase;letter-spacing:.06em;font-weight:300}
.cities .cbar{height:1px;background:var(--line-2);margin-top:9px;position:relative}
.cities .cbar i{position:absolute;left:0;top:-.5px;height:2px;background:var(--red);box-shadow:0 0 10px rgba(255,43,43,.6)}

@media(max-width:640px){.bar .right .title{display:none}.badge{width:24px;height:24px}.dots{right:2px}.dots button{width:16px;height:28px}}
@media(max-height:560px){.pin{justify-content:flex-start}}
</style>
</head>
<body>
<div class="heroBg" aria-hidden="true"></div>

<header class="bar">
  <div class="brand">
    <svg class="badge" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="currentColor" stroke-width="1"/><text x="20" y="27" text-anchor="middle" font-size="20" font-weight="300" fill="currentColor" font-family="Inter,system-ui,sans-serif">≠</text></svg>
    <span class="micro">Not Another Run Club</span>
  </div>
  <div class="right">
    <span class="micro title" id="pgTitle"></span>
    <span class="micro num" id="pgCount" aria-live="polite"></span>
  </div>
</header>

<nav class="dots" id="dots" aria-label="Pages"></nav>

<main id="deck">
  <section class="page active" id="top" data-title="The Calendar Club" aria-label="The Calendar Club">
    <div class="pin hero">
      <p class="micro">01 — 24 December 2026</p>
      <h1 class="display">The Calendar<br>Club.</h1>
      <p class="lead display">Day X = X km.</p>
      <p class="micro rule">Run as many kilometres as the date. Every day, from the 1st to the 24th.</p>
      <div class="status micro" id="status" aria-live="polite"></div>
      <div class="demo-pill micro" id="demoPill" hidden><span class="dot-live"></span>Demo data · not real runners</div>
      <p class="micro" id="updated"></p>
    </div>
  </section>

  <section class="page" id="calendar" data-title="The calendar" aria-label="The calendar">
    <div class="pin">
      <div class="sec-head">
        <h2 class="display">The calendar.</h2>
        <p class="micro">Tap a day to open its leaderboard</p>
      </div>
      <div class="cal" id="cal" role="group" aria-label="Days 1 to 24"></div>
    </div>
  </section>

  <section class="page" id="leaderboard" data-title="Leaderboard" aria-label="Leaderboard">
    <div class="pin" style="justify-content:flex-start">
      <div class="sec-head">
        <h2 class="display">Leaderboard.</h2>
        <div class="meta">
          <p class="micro" id="resMeta"></p>
          <button class="linkbtn" id="resAll" type="button" hidden>← All days</button>
        </div>
      </div>
      <p class="micro notice" id="notice" aria-live="polite"></p>
      <div class="board" id="board" role="table" aria-label="Leaderboard"></div>
      <p class="micro ranknote" id="rankNote"></p>
    </div>
  </section>

  <section class="page" id="map" data-title="Where we ran" aria-label="Where we ran">
    <div class="pin">
      <div class="sec-head">
        <h2 class="display">Where we ran.</h2>
        <div class="meta">
          <button class="linkbtn" id="mapAll" type="button" hidden>← All days</button>
          <div class="seg" id="seg" role="group" aria-label="Map area"></div>
        </div>
      </div>
      <div class="mapgrid">
        <div>
          <div class="mapwrap" id="mapwrap"></div>
          <div class="legend micro"><i aria-hidden="true"></i><span id="mapNote"></span></div>
        </div>
        <div>
          <p class="micro" style="margin-bottom:6px" id="cityHead">Cities</p>
          <ul class="cities" id="cities"></ul>
          <p class="micro" id="cityMore" style="margin-top:14px"></p>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <button class="next" id="nextBtn" type="button"><span class="micro" id="nextLab"></span><span class="micro arr" aria-hidden="true">↓</span></button>
</footer>

<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#0a0a0b;color:#f3f3f1;z-index:99">This page needs JavaScript.</p></noscript>

<script src="shared.js"></script>
<script>
(() => {
'use strict';
const { DAYS, norm, pad2, fmtKm, fmtTime, fmtPace, fmtInt, CITIES, cityKey, clean } = window.CC;

/* ===== SETTINGS ===== */
const YEAR = 2026;          // challenge year (1–24 December)
const TZ = 'Europe/Budapest';
const RANK_BY = 'time';     // 'time': fastest total time wins   |   'pace': fastest average pace wins (fairer when runners have different days)
const POLL_MS = 60000;      // how often the open page checks data.json for news

const $ = (q) => document.querySelector(q);
const NS = 'http://www.w3.org/2000/svg';
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return el;
}
function s(tag, props, text) {
  const el = document.createElementNS(NS, tag);
  if (props) for (const [k, v] of Object.entries(props)) if (v != null) el.setAttribute(k, v);
  if (text != null) el.textContent = text;
  return el;
}

/* ===== STATE ===== */
const DEMO_Q = /[?&]demo(=|&|$)/.test(location.search);
let DATA = null, ENTRIES = [], loaded = false, lastText = null;
const state = { day: null, mapDay: null, view: null, active: null, touched: false };   // day = leaderboard filter, mapDay = map filter
let GEO = null;

function isDemo() { return DEMO_Q || !!(DATA && DATA.demo); }
function todayInfo() {
  if (isDemo()) return { phase: 'live', day: (DATA && DATA.previewToday) || 9 };
  const [y, m, d] = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()).split('-').map(Number);
  const diff = Math.round((Date.UTC(y, m - 1, d) - Date.UTC(YEAR, 11, 1)) / 864e5);
  if (diff < 0) return { phase: 'before', in: -diff };
  if (diff >= DAYS) return { phase: 'after' };
  return { phase: 'live', day: diff + 1 };
}

/* ===== AGGREGATION ===== */
function computeRows(day) {
  const groups = new Map();
  for (const e of ENTRIES) { const k = norm(e.name); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); }
  const rows = [];
  for (const [key, es] of groups) {
    es.sort((a, b) => (a.at - b.at) || (a.day - b.day));
    const byDay = new Map(); for (const e of es) byDay.set(e.day, e);          // one result per day — the latest entry wins
    const days = [...byDay.values()], doneDays = days.filter((e) => e.done);
    const sel = day ? days.filter((e) => e.day === day) : days, selDone = sel.filter((e) => e.done), timed = selDone.filter((e) => e.sec != null);
    const sumSec = (l) => l.reduce((a, e) => a + e.sec, 0), sumKm = (l) => l.reduce((a, e) => a + e.day, 0);      // a finished day is worth its own number of km
    const allTimed = doneDays.filter((e) => e.sec != null);
    rows.push({
      key, name: es[0].name, daysDone: doneDays.length,
      dayKm: sumKm(selDone), sec: timed.length ? sumSec(timed) : null, pace: timed.length ? sumSec(timed) / sumKm(timed) : null,                 // the selected day (all days when none is selected)
      totalKm: sumKm(doneDays), tsec: allTimed.length ? sumSec(allTimed) : null, tpace: allTimed.length ? sumSec(allTimed) / sumKm(allTimed) : null, // all days, counted by the page
      ranked: selDone.length > 0, tried: sel.length > 0, timeComplete: selDone.length > 0 && timed.length === selDone.length, rank: null,
    });
  }
  /* RANKING: 1) finished the job first (the day's distance; overall: most days finished)  2) then the faster time (runners whose times are all entered go first)  3) then name */
  const t = (r) => { const v = RANK_BY === 'pace' ? r.pace : r.sec; return v == null ? Infinity : v; };
  const ranked = rows.filter((r) => r.ranked).sort((a, b) =>
    (day ? 0 : b.daysDone - a.daysDone) || (Number(b.timeComplete) - Number(a.timeComplete)) || (t(a) - t(b)) || (b.totalKm - a.totalKm) || a.name.localeCompare(b.name, 'hu'));
  ranked.forEach((r, i) => { r.rank = i + 1; });
  const rest = rows.filter((r) => !r.ranked).sort((a, b) => (Number(b.tried) - Number(a.tried)) || a.name.localeCompare(b.name, 'hu'));
  return ranked.concat(rest);
}
function cityStats(es) {
  const m = new Map();
  for (const e of es) {
    const k = cityKey(e.city); if (!k) continue;
    let c = m.get(k); if (!c) { c = { key: k, name: e.city, km: 0, runs: 0, runners: new Set(), lat: null, lon: null }; m.set(k, c); }
    c.km += e.km; c.runs++; c.runners.add(norm(e.name));
    if (c.lat == null && e.lat != null && e.lon != null) { c.lat = e.lat; c.lon = e.lon; }
  }
  for (const c of m.values()) { const t = CITIES.get(norm(c.name)); if (t) { c.name = t.name; if (c.lat == null) { c.lat = t.lat; c.lon = t.lon; } } }
  return [...m.values()].sort((a, b) => b.km - a.km);
}

/* ===== PAGE 1: status ===== */
function renderStatus() {
  const t = todayInfo(), el = $('#status'); el.replaceChildren();
  if (t.phase === 'live') el.append(h('span', { class: 'dot-live' }), `Today · Day ${pad2(t.day)} · ${t.day} km`);
  else if (t.phase === 'before') el.append(`Opens in ${t.in} ${t.in === 1 ? 'day' : 'days'} · 01 Dec`);
  else el.append('The calendar is closed · see you next year');
  $('#demoPill').hidden = !isDemo();
  const last = ENTRIES.reduce((a, e) => Math.max(a, e.at || 0), 0);
  $('#updated').textContent = last && !isDemo() ? 'Last update · ' + new Intl.DateTimeFormat('en-GB', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).format(new Date(last)) : '';
}

/* ===== PAGE 2: calendar ===== */
function renderCal() {
  const t = todayInfo(), el = $('#cal'); el.replaceChildren();
  const perDay = new Map();   // day -> runner -> finished?
  for (const e of [...ENTRIES].sort((x, y) => x.at - y.at)) { if (!perDay.has(e.day)) perDay.set(e.day, new Map()); perDay.get(e.day).set(norm(e.name), e.done); }
  for (let d = 1; d <= DAYS; d++) {
    const m = perDay.get(d); let met = 0;
    if (m) for (const v of m.values()) if (v) met++;
    const future = t.phase === 'before' || (t.phase === 'live' && d > t.day);
    el.append(h('button', {
      type: 'button', class: 'tile' + (t.phase === 'live' && d === t.day ? ' today' : '') + (future ? ' future' : ''),
      'aria-pressed': String(state.day === d), 'aria-label': `Day ${d}, ${d} km — open leaderboard`,
      onclick: () => { state.day = d; state.mapDay = d; state.touched = true; renderAll(); go(2, 'jump', true); },
    }, h('span', { class: 'n num' }, pad2(d)), h('span', { class: 'bt' }, m ? h('span', { class: 'met micro num' }, '✓ ' + met) : null, h('span', { class: 'km micro' }, d + ' km'))));
  }
}

/* ===== PAGE 3: leaderboard ===== */
/* [css class, header label, short label for phones] */
const COLS_DAY = [['km', 'Distance', 'Distance'], ['sec', 'Time', 'Time'], ['pace', 'Avg pace', 'Avg pace']];
const COLS_TOT = [['tkm', 'Total distance', 'Total dist.'], ['tsec', 'Total time', 'Total time'], ['tpace', 'Avg total pace', 'Total pace']];
function renderBoard() {
  const root = $('#board'); root.replaceChildren();
  const day = state.day, rows = computeRows(day);
  root.className = 'board' + (day ? '' : ' all');
  const totalKm = rows.reduce((a, r) => a + r.totalKm, 0);
  const doneN = rows.filter((r) => r.ranked).length;
  $('#resMeta').textContent = day
    ? `Day ${pad2(day)} · ${day} km · ${doneN} of ${rows.length} finished`
    : `Overall · ${rows.length} ${rows.length === 1 ? 'runner' : 'runners'} · ${fmtInt(totalKm)} km`;
  $('#resAll').hidden = !day;
  const how = RANK_BY === 'pace' ? 'average pace' : 'time';
  $('#rankNote').textContent = rows.length ? (day ? `Ranked by finishers first, then fastest ${how} on day ${pad2(day)}. Distance, time and pace are for day ${pad2(day)}; the totals add up every day (day 7 = 7 km).` : `Ranked by days finished first, then fastest ${how}. Distance = the days finished added up (day 7 = 7 km).`) : '';
  if (!loaded) { root.append(h('div', { class: 'empty' }, h('p', { class: 'micro' }, 'Loading results…'))); return; }
  if (!rows.length) {
    const t = todayInfo();
    root.append(h('div', { class: 'empty' }, h('p', { class: 'display' }, 'No results yet.'),
      h('p', { class: 'micro', style: 'margin-top:14px' }, t.phase === 'before' ? 'The calendar opens on 01 December.' : 'Nothing has been logged yet.')));
    return;
  }
  const cols = (day ? COLS_DAY : []).concat(COLS_TOT);
  const head = h('div', { class: 'head', role: 'row' }, h('span', { class: 'micro hd-rank', role: 'columnheader' }, '#'), h('span', { class: 'micro', role: 'columnheader' }, 'Runner'));
  for (const [, label] of cols) head.append(h('span', { class: 'micro', role: 'columnheader' }, label));
  root.append(head);
  rows.forEach((r, i) => {
    const top = i === 0 && r.rank === 1;
    let sub;
    if (day) sub = r.ranked ? `Day ${pad2(day)} · ✓ Finished` : r.tried ? `Day ${pad2(day)} · ✗ Not finished` : 'No result yet';
    else sub = `${r.daysDone} ${r.daysDone === 1 ? 'day' : 'days'} finished`;
    const val = { km: [r.ranked ? fmtInt(r.dayKm) : '—', 'km'], sec: [fmtTime(r.sec), ''], pace: [fmtPace(r.pace), '/km'], tkm: [fmtInt(r.totalKm), 'km'], tsec: [fmtTime(r.tsec), ''], tpace: [fmtPace(r.tpace), '/km'] };
    const cell = ([cls, label, short]) => h('span', { class: 'cell ' + cls, role: 'cell', 'data-l': label, 'data-s': short }, h('span', { class: 'v' }, val[cls][0]), val[cls][1] && val[cls][0] !== '—' ? h('span', { class: 'u' }, val[cls][1]) : null);
    root.append(h('div', { class: 'row' + (top ? ' top' : '') + (r.ranked ? '' : ' dim'), role: 'row' },
      h('span', { class: 'rank cell num', role: 'cell' }, r.rank ? pad2(r.rank) : '—'),
      h('span', { class: 'who cell', role: 'cell' }, h('span', { class: 'name' }, r.name), h('span', { class: 'sub micro' }, sub)),
      ...cols.map(cell)));
  });
}

/* ===== PAGE 4: map ===== */
const W = 1000, rad = (d) => d * Math.PI / 180;
const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + rad(Math.max(-85, Math.min(85, lat))) / 2));
const VIEWS = {
  hu: { label: 'Hungary', bbox: [15.2, 45.2, 23.9, 49.2], K: [24, 6.5, 110], core: 4.6, fs: 13 },
  eu: { label: 'Europe', bbox: [-11, 34, 42, 63], K: [12, 3.6, 52], core: 3.2, fs: 11 },
  world: { label: 'World', bbox: [-180, -58, 180, 80], K: [8, 2.2, 30], core: 2.4, fs: 9 },
};
for (const v of Object.values(VIEWS)) { const [lo0, la0, lo1, la1] = v.bbox; v.k = W / rad(lo1 - lo0); v.y0 = merc(la1); v.w = W; v.h = Math.round((merc(la1) - merc(la0)) * v.k); }
const project = (v, lon, lat) => [rad(lon - v.bbox[0]) * v.k, (v.y0 - merc(lat)) * v.k];
const inside = (v, c) => c.lon >= v.bbox[0] && c.lon <= v.bbox[2] && c.lat >= v.bbox[1] && c.lat <= v.bbox[3];
function autoView(cs) {
  if (!cs.length) return 'hu';
  if (cs.every((c) => inside(VIEWS.hu, c))) return 'hu';
  if (cs.every((c) => inside(VIEWS.eu, c))) return 'eu';
  return 'world';
}
const mapState = { key: null, svg: null, land: null, dots: null, tip: null };
function showTip(c, v, x, y) {
  const tip = mapState.tip; tip.replaceChildren(h('b', null, c.name), h('span', { class: 'micro' }, `${c.runners.size} ${c.runners.size === 1 ? 'runner' : 'runners'} · ${c.runs} ${c.runs === 1 ? 'run' : 'runs'} · ${fmtKm(c.km)} km`));
  const py = y / v.h * 100; tip.style.left = Math.min(84, Math.max(16, x / v.w * 100)) + '%'; tip.style.top = py + '%'; tip.classList.toggle('below', py < 24); tip.classList.add('on');
}
const hideTip = () => { if (mapState.tip) mapState.tip.classList.remove('on'); };
function setActive(key) {
  state.active = key;
  document.querySelectorAll('.dot').forEach((n) => n.classList.toggle('on', n.dataset.k === key));
  document.querySelectorAll('.cities li').forEach((n) => n.classList.toggle('on', n.dataset.k === key));
}
function renderMap() {
  const es = (state.mapDay ? ENTRIES.filter((e) => e.day === state.mapDay) : ENTRIES).filter((e) => e.done);
  const cs = cityStats(es), located = cs.filter((c) => c.lat != null);
  const key = state.view || autoView(located), v = VIEWS[key];
  $('#mapAll').hidden = !state.mapDay;
  const seg = $('#seg'); seg.replaceChildren();
  for (const [k, vv] of Object.entries(VIEWS)) seg.append(h('button', { type: 'button', 'aria-pressed': String(k === key), onclick: () => { state.view = k; renderMap(); } }, vv.label));
  const wrap = $('#mapwrap');
  if (mapState.key !== key) {
    const svg = s('svg', { viewBox: `0 0 ${v.w} ${v.h}`, role: 'img', 'aria-label': 'Map of cities where runs were completed' });
    const defs = s('defs'), g = s('radialGradient', { id: 'heat' });
    g.append(s('stop', { offset: '0', 'stop-color': '#ff2b2b', 'stop-opacity': '.95' }), s('stop', { offset: '.35', 'stop-color': '#ff2b2b', 'stop-opacity': '.42' }), s('stop', { offset: '1', 'stop-color': '#ff2b2b', 'stop-opacity': '0' }));
    defs.append(g);
    const land = s('path', { d: GEO && GEO.views[key] ? GEO.views[key].d : '' });
    const gl = s('g', { class: 'land' }); gl.append(land);
    const dots = s('g');
    svg.append(defs, gl, dots);
    const tip = h('div', { class: 'tip', role: 'status' });
    wrap.replaceChildren(svg, tip);
    svg.addEventListener('click', (ev) => { if (!ev.target.classList.contains('hit')) { hideTip(); setActive(null); } });
    Object.assign(mapState, { key, svg, land, dots, tip });
  }
  const dots = mapState.dots; dots.replaceChildren();
  const vis = located.filter((c) => inside(v, c));
  const rOf = (km) => Math.min(v.K[2], v.K[0] + v.K[1] * Math.sqrt(km));
  const pts = vis.map((c) => ({ c, p: project(v, c.lon, c.lat) }));
  for (const { c, p } of pts.slice().reverse()) {
    const [x, y] = p, r = rOf(c.km);
    const g = s('g', { class: 'dot', 'data-k': c.key, tabindex: '0', role: 'img', 'aria-label': `${c.name}: ${fmtKm(c.km)} km, ${c.runners.size} runners` });
    g.append(s('circle', { class: 'glow', cx: x, cy: y, r, fill: 'url(#heat)' }), s('circle', { class: 'core', cx: x, cy: y, r: v.core }), s('circle', { class: 'hit', cx: x, cy: y, r: Math.max(r * 0.55, 14) }));
    const on = () => { showTip(c, v, x, y); setActive(c.key); };
    g.addEventListener('pointerenter', on); g.addEventListener('focus', on);
    g.addEventListener('pointerleave', () => { hideTip(); setActive(null); }); g.addEventListener('blur', () => { hideTip(); setActive(null); });
    g.addEventListener('click', on);
    dots.append(g);
  }
  const placed = [];
  for (const { c, p } of pts.slice(0, 8)) {
    const [x, y] = p, txt = c.name.toUpperCase(), w = txt.length * v.fs * 0.78 + 8, left = x + v.core + 8 + w > v.w - 6;
    const x0 = left ? x - v.core - 8 - w : x + v.core + 8, box = [x0, y - v.fs, x0 + w, y + v.fs * 0.4];
    if (placed.some((b) => !(box[2] < b[0] || box[0] > b[2] || box[3] < b[1] || box[1] > b[3]))) continue;
    placed.push(box);
    dots.append(s('text', { class: 'maplabel', x: left ? x - v.core - 8 : x + v.core + 8, y: y + v.fs * 0.35, 'font-size': v.fs, 'text-anchor': left ? 'end' : 'start' }, txt));
  }
  $('#mapNote').textContent = `Red glow = kilometres run in that city · ${state.mapDay ? 'day ' + pad2(state.mapDay) : 'all days'}`;
  const ul = $('#cities'); ul.replaceChildren();
  const max = cs.length ? cs[0].km : 1;
  $('#cityHead').textContent = state.mapDay ? `Cities · day ${pad2(state.mapDay)}` : 'Cities · all days';
  for (const c of cs.slice(0, 14)) {
    const li = h('li', { 'data-k': c.key },
      h('div', { class: 'line' }, h('span', { class: 'cn' }, c.name), h('span', { class: 'micro num' }, `${c.runners.size} · ${fmtKm(c.km)} km`)),
      h('div', { class: 'cbar' }, h('i', { style: `width:${Math.max(3, c.km / max * 100)}%` })));
    li.addEventListener('pointerenter', () => { setActive(c.key); const q = pts.find((o) => o.c.key === c.key); if (q) showTip(c, v, q.p[0], q.p[1]); });
    li.addEventListener('pointerleave', () => { setActive(null); hideTip(); });
    ul.append(li);
  }
  if (!cs.length) ul.append(h('li', null, h('span', { class: 'micro' }, 'No runs yet')));
  const hidden = cs.length - vis.length, extra = cs.length > 14 ? cs.length - 14 : 0;
  const msgs = [];
  if (hidden > 0) msgs.push(`${hidden} ${hidden === 1 ? 'city is' : 'cities are'} outside this view or have no coordinates`);
  if (extra > 0) msgs.push(`+${extra} more in the list`);
  $('#cityMore').textContent = msgs.join(' · ');
}

function renderAll() { renderStatus(); renderCal(); renderBoard(); renderMap(); }

/* ===== DECK NAVIGATION: one page at a time, cross-fade between them ===== */
const pages = [...document.querySelectorAll('.page')];
const IDS = pages.map((p) => p.id);
const TITLES = pages.map((p) => p.dataset.title);
let cur = 0, locked = false;
const dotsEl = $('#dots');
pages.forEach((p, i) => dotsEl.append(h('button', { type: 'button', 'aria-label': `${pad2(i + 1)} ${TITLES[i]}`, title: TITLES[i], onclick: () => go(i, i < cur ? 'back' : 'jump', true) })));

function show(i) {
  cur = i;
  pages.forEach((p, k) => { const on = k === i; p.classList.toggle('active', on); p.inert = !on; p.setAttribute('aria-hidden', on ? 'false' : 'true'); });
  [...dotsEl.children].forEach((b, k) => { if (k === i) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  $('#pgCount').textContent = `${pad2(i + 1)} / ${pad2(pages.length)}`;
  $('#pgTitle').textContent = TITLES[i];
  const last = i === pages.length - 1, nb = $('#nextBtn');
  nb.classList.toggle('up', last);
  $('#nextLab').textContent = last ? 'Back to start' : 'Next · ' + TITLES[i + 1];
  nb.querySelector('.arr').textContent = last ? '↑' : '↓';
  document.title = (i ? TITLES[i] + ' · ' : '') + 'The Calendar Club';
  try { history.replaceState(null, '', '#' + IDS[i]); } catch (e) {}
}
function go(i, how, force) {
  i = Math.max(0, Math.min(pages.length - 1, i));
  if (i === cur || (locked && !force)) return false;
  locked = true; setTimeout(() => { locked = false; }, 850);
  const p = pages[i]; p.scrollTop = how === 'back' ? p.scrollHeight : 0;
  show(i); return true;
}
const canScroll = (dir) => { const p = pages[cur]; return dir > 0 ? p.scrollTop + p.clientHeight < p.scrollHeight - 2 : p.scrollTop > 2; };
const flip = (dir) => go(dir > 0 && cur === pages.length - 1 ? 0 : cur + dir, dir < 0 ? 'back' : 'jump');

/* wheel / trackpad — only a fresh gesture that STARTS at the edge of a page flips it, so inertia never skips pages */
let lastWheel = 0, consumed = false, edgeAtStart = false;
window.addEventListener('wheel', (e) => {
  if (e.ctrlKey || Math.abs(e.deltaY) < Math.abs(e.deltaX)) return;
  const now = performance.now(), fresh = now - lastWheel > 120; lastWheel = now;
  const dir = e.deltaY > 0 ? 1 : -1;
  if (fresh) { consumed = false; edgeAtStart = !canScroll(dir); }
  if (canScroll(dir)) { if (!pages[cur].contains(e.target)) { e.preventDefault(); pages[cur].scrollTop += e.deltaY; } return; }
  e.preventDefault();
  if (consumed || !edgeAtStart || Math.abs(e.deltaY) < 6) return;
  consumed = true;
  if (dir > 0 && cur === pages.length - 1) return;
  go(cur + dir, dir < 0 ? 'back' : 'jump');
}, { passive: false });

/* touch — swipe up/down, flips only when the swipe BEGAN at the page edge */
let t0 = null;
window.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) { t0 = null; return; }
  const t = e.touches[0]; t0 = { x: t.clientX, y: t.clientY, down: !canScroll(1), up: !canScroll(-1) };
}, { passive: true });
window.addEventListener('touchend', (e) => {
  if (!t0) return;
  const t = e.changedTouches[0], dy = t0.y - t.clientY, dx = t0.x - t.clientX, st = t0; t0 = null;
  if (Math.abs(dy) < 50 || Math.abs(dy) < Math.abs(dx) * 1.2) return;
  const dir = dy > 0 ? 1 : -1;
  if ((dir > 0 && st.down) || (dir < 0 && st.up)) go(cur + dir, dir < 0 ? 'back' : 'jump');
}, { passive: true });
window.addEventListener('touchcancel', () => { t0 = null; }, { passive: true });

/* keyboard */
window.addEventListener('keydown', (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  const k = e.key; let dir = 0, step = 0;
  if (k === 'ArrowDown') { dir = 1; step = 90; } else if (k === 'ArrowUp') { dir = -1; step = 90; }
  else if (k === 'PageDown') { dir = 1; step = 0.85; } else if (k === 'PageUp') { dir = -1; step = 0.85; }
  else if (k === ' ' && tag !== 'BUTTON' && tag !== 'A') { dir = e.shiftKey ? -1 : 1; step = 0.85; }
  else if (k === 'Home') { e.preventDefault(); go(0, 'back'); return; }
  else if (k === 'End') { e.preventDefault(); go(pages.length - 1, 'jump'); return; }
  if (!dir) return;
  e.preventDefault();
  if (canScroll(dir)) { const p = pages[cur]; p.scrollBy({ top: dir * (step < 5 ? step * p.clientHeight : step), behavior: 'smooth' }); return; }
  if (dir > 0 && cur === pages.length - 1) return;
  go(cur + dir, dir < 0 ? 'back' : 'jump');
});

$('#nextBtn').addEventListener('click', () => { if (cur === pages.length - 1) go(0, 'back', true); else go(cur + 1, 'jump', true); });
$('#resAll').addEventListener('click', () => { state.day = null; state.mapDay = null; state.touched = true; renderAll(); });
$('#mapAll').addEventListener('click', () => { state.day = null; state.mapDay = null; state.touched = true; renderAll(); });
window.addEventListener('hashchange', () => { const i = IDS.indexOf(location.hash.slice(1)); if (i >= 0 && i !== cur) go(i, i < cur ? 'back' : 'jump', true); });

/* ===== DATA ===== */
function apply(j) {
  DATA = j && typeof j === 'object' ? j : {};
  ENTRIES = (Array.isArray(DATA.entries) ? DATA.entries : []).map((d) => clean(d && d.id, d)).filter(Boolean);
  loaded = true; $('#notice').textContent = '';
  if (!state.touched) { const t = todayInfo(); state.day = t.phase === 'live' ? t.day : null; }   // while the event runs, the leaderboard opens on today
  renderAll();
}
async function loadData() {
  if (DEMO_Q) return;
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    if (text === lastText) { $('#notice').textContent = ''; return; }
    const j = JSON.parse(text); lastText = text; apply(j);
  } catch (e) {
    if (!loaded) { loaded = true; renderAll(); }
    $('#notice').textContent = location.protocol === 'file:' ? 'Open this page from a web address (e.g. GitHub Pages) — browsers block data files on local files.' : 'Results could not be refreshed just now. Showing the last known data.';
  }
}

async function boot() {
  const start = IDS.indexOf(location.hash.slice(1));
  show(start >= 0 ? start : 0);
  if (DEMO_Q) apply({ demo: true, previewToday: 9, entries: window.CC.demoEntries(9) });
  else renderAll();
  fetch('geo.json').then((r) => r.json()).then((j) => { GEO = j; if (mapState.land && j.views[mapState.key]) mapState.land.setAttribute('d', j.views[mapState.key].d); }).catch(() => {});
  await loadData();
  setInterval(() => { if (document.visibilityState === 'visible') loadData(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(); });
}
boot();
})();
